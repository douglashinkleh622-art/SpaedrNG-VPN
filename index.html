<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080c">

<title>SpaedrNG VPN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(229,9,20,.14),
            transparent 38%
        ),
        #07080c;

    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.app{
    width:min(430px,94vw);
    min-height:680px;

    padding:28px 20px;

    border:1px solid #292d38;
    border-radius:28px;

    background:#11131a;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    gap:14px;
}


/* LOGO */

.logo{
    text-align:center;
}

.logoIcon{
    width:72px;
    height:72px;

    border-radius:22px;

    background:#171a23;
    border:1px solid #373b47;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    margin:auto;
}

.logo h1{
    margin-top:13px;

    font-size:27px;
    letter-spacing:1px;
}

.logo p{
    margin-top:6px;

    color:#8e94a3;
    font-size:12px;
}


/* STATUS */

.statusBox{
    text-align:center;
}

.status{
    font-size:18px;
    font-weight:bold;
}

.dot{
    display:inline-block;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#e50914;

    margin-left:7px;

    box-shadow:
        0 0 14px rgba(229,9,20,.7);
}

.statusBox.connected .dot{
    background:#20d66b;

    box-shadow:
        0 0 15px rgba(32,214,107,.75);
}

.serverName{
    margin-top:10px;

    color:#8e94a3;
    font-size:13px;
}


/* SERVER COUNT */

.serverCount{
    margin-top:11px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:5px;

    padding:7px 15px;

    border-radius:12px;

    background:#171a23;

    border:1px solid #292d38;

    color:#ff3340;

    font-size:12px;
}

.serverCount small{
    color:#777e8d;
    font-size:10px;
}


/* SELECTOR */

.selector{
    width:100%;
}

.label{
    color:#8e94a3;

    font-size:12px;

    margin-bottom:8px;

    display:block;
}

.select{
    width:100%;
    height:54px;

    padding:0 15px;

    border-radius:15px;

    border:1px solid #303440;

    background:#171a23;

    color:#fff;

    font-family:inherit;
    font-size:14px;

    outline:none;
}

.select:focus{
    border-color:#e50914;
}

.select:disabled{
    opacity:.5;
}


/* CONNECT */

.connectBtn{
    width:180px;
    height:180px;

    border-radius:50%;

    border:1px solid #3a3e49;

    background:
        radial-gradient(
            circle,
            #181b24,
            #101219 70%
        );

    color:#fff;

    font-family:inherit;

    font-size:21px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 0 8px rgba(229,9,20,.035),
        0 0 55px rgba(229,9,20,.13);

    transition:.25s;
}

.connectBtn:active{
    transform:scale(.96);
}

.connectBtn.connected{
    border-color:#20d66b;

    box-shadow:
        0 0 0 8px rgba(32,214,107,.035),
        0 0 55px rgba(32,214,107,.18);
}


/* IMPORT */

.importBox{
    width:100%;

    padding:14px;

    border-radius:16px;

    background:#171a23;

    border:1px solid #292d38;
}

.importTitle{
    font-size:13px;
    font-weight:bold;

    margin-bottom:9px;
}

.importInput{
    width:100%;

    min-height:70px;

    resize:none;

    padding:11px;

    border-radius:12px;

    border:1px solid #303440;

    background:#101219;

    color:#fff;

    font-family:Arial,sans-serif;

    font-size:11px;

    direction:ltr;

    outline:none;
}

.importInput:focus{
    border-color:#e50914;
}

.importBtn{
    width:100%;

    height:43px;

    margin-top:9px;

    border:0;

    border-radius:12px;

    background:#e50914;

    color:#fff;

    font-family:inherit;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.importBtn:active{
    transform:scale(.97);
}


/* ACTIVE CONFIG */

.active{
    width:100%;

    padding:13px;

    border-radius:15px;

    background:#171a23;

    border:1px solid #292d38;

    text-align:center;
}

.activeTitle{
    color:#777e8d;

    font-size:11px;

    margin-bottom:5px;
}

.activeName{
    font-size:14px;
    font-weight:bold;
}

.active.off{
    opacity:.55;
}


/* FOOTER */

.footer{
    color:#5f6573;

    font-size:10px;

    text-align:center;
}

.footer a{
    color:#ff3340;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:430px){

    .app{
        min-height:670px;
        padding:24px 17px;
    }

    .connectBtn{
        width:165px;
        height:165px;
    }

    .logo h1{
        font-size:24px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- LOGO -->

    <div class="logo">

        <div class="logoIcon">
            🕷️
        </div>

        <h1>
            SpaedrNG
        </h1>

        <p>
            VLESS VPN
        </p>

    </div>


    <!-- STATUS -->

    <div
        class="statusBox"
        id="statusBox">

        <div class="status">

            <span class="dot"></span>

            <span id="statusText">
                قطع
            </span>

        </div>

        <div
            class="serverName"
            id="serverName">

            آماده اتصال

        </div>

        <div class="serverCount">

            <span id="serverCount">
                ۳
            </span>

            <small>
                سرور
            </small>

        </div>

    </div>


    <!-- SERVER SELECT -->

    <div class="selector">

        <span class="label">
            انتخاب سرور
        </span>

        <select
            id="configSelect"
            class="select">

        </select>

    </div>


    <!-- CONNECT -->

    <button
        id="connectBtn"
        class="connectBtn"
        type="button">

        اتصال

    </button>


    <!-- IMPORT -->

    <div class="importBox">

        <div class="importTitle">
            📥 ایمپورت کانفیگ
        </div>

        <textarea
            id="importInput"
            class="importInput"
            placeholder="VLESS را اینجا وارد کنید..."></textarea>

        <button
            id="importBtn"
            class="importBtn"
            type="button">

            افزودن کانفیگ

        </button>

    </div>


    <!-- ACTIVE -->

    <div
        id="activeBox"
        class="active off">

        <div class="activeTitle">
            کانفیگ فعال
        </div>

        <div
            id="activeName"
            class="activeName">

            هیچ کانفیگی فعال نیست

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <a
            href="https://t.me/spaedrNG"
            target="_blank"
            rel="noopener">

            🕷️ کانال SpaedrNG

        </a>

        <div style="margin-top:5px;">
            SpaedrNG • V2RayNG
        </div>

    </div>

</div>


<script>

/* =========================
   DEFAULT CONFIGS
========================= */

const configs = [

    {
        name:"🕷️ سرور ۱",

        vless:
        "vless://50414e45-4c5f-5a45-5553-2082bb32c0c0@9azpnde0ubts.nova-708ad7eaa455.workers.dev:2053?path=%2Fstream%2FPANEL_ZEUS%2F2082bb32c0c0&security=tls&encryption=none&host=9azpnde0ubts.nova-708ad7eaa455.workers.dev&type=ws&insecure=0&fp=unsafe&allowInsecure=0&sni=9azpnde0ubts.nova-708ad7eaa455.workers.dev#SpaedrNG"
    },

    {
        name:"🕷️ سرور ۲",

        vless:
        "vless://50414e45-4c5f-5a45-5553-2082bb32c0c0@9azpnde0ubts.nova-708ad7eaa455.workers.dev:2083?path=%2Fstream%2FPANEL_ZEUS%2F2082bb32c0c0&security=tls&encryption=none&host=9azpnde0ubts.nova-708ad7eaa455.workers.dev&type=ws&insecure=0&fp=unsafe&allowInsecure=0&sni=9azpnde0ubts.nova-708ad7eaa455.workers.dev#SpaedrNG"
    },

    {
        name:"🕷️ سرور ۳",

        vless:
        "vless://b30e1d14-0a07-4da0-a8fb-575fa11e2ca8@amirxf-production.up.railway.app:443?encryption=none&security=tls&type=ws&host=amirxf-production.up.railway.app&path=%2Fws%2Fb30e1d14-0a07-4da0-a8fb-575fa11e2ca8&sni=amirxf-production.up.railway.app&fp=chrome&alpn=http/1.1#SpaedrNG"
    }

];


/* =========================
   ELEMENTS
========================= */

const connectBtn =
    document.getElementById("connectBtn");

const configSelect =
    document.getElementById("configSelect");

const statusBox =
    document.getElementById("statusBox");

const statusText =
    document.getElementById("statusText");

const serverName =
    document.getElementById("serverName");

const activeBox =
    document.getElementById("activeBox");

const activeName =
    document.getElementById("activeName");

const serverCount =
    document.getElementById("serverCount");

const importInput =
    document.getElementById("importInput");

const importBtn =
    document.getElementById("importBtn");


/* =========================
   STATE
========================= */

let connected = false;


/* =========================
   RENDER SERVERS
========================= */

function renderServers(){

    configSelect.innerHTML = "";

    configs.forEach(function(config,index){

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            config.name;

        configSelect.appendChild(option);

    });

    serverCount.textContent =
        configs.length;

}


/* =========================
   UPDATE SERVER
========================= */

function updateServer(){

    const selected =
        configs[
            Number(configSelect.value)
        ];

    if(!selected) return;

    serverName.textContent =
        selected.name;

}


/* =========================
   SELECT CHANGE
========================= */

configSelect.addEventListener(
    "change",
    function(){

        if(connected){

            alert(
                "ابتدا اتصال فعلی را قطع کنید."
            );

            return;
        }

        updateServer();

    }
);


/* =========================
   CONNECT BUTTON
========================= */

connectBtn.addEventListener(
    "click",
    function(){

        if(connected){

            disconnect();

        }else{

            connect();

        }

    }
);


/* =========================
   CONNECT
========================= */

function connect(){

    const selected =
        configs[
            Number(configSelect.value)
        ];

    if(!selected) return;


    statusText.textContent =
        "در حال انتقال...";

    serverName.textContent =
        selected.name;


    /*
     * ارسال کانفیگ به V2RayNG
     */

    const v2rayngURL =
        "v2rayng://install-config?url=" +
        encodeURIComponent(
            selected.vless
        );


    window.location.href =
        v2rayngURL;


    setTimeout(function(){

        connected = true;

        statusBox.classList.add(
            "connected"
        );

        statusText.textContent =
            "متصل";

        serverName.textContent =
            selected.name + " • فعال";

        activeBox.classList.remove(
            "off"
        );

        activeName.textContent =
            selected.name;

        connectBtn.classList.add(
            "connected"
        );

        connectBtn.textContent =
            "قطع";

        configSelect.disabled =
            true;

    },1200);

}


/* =========================
   DISCONNECT
========================= */

function disconnect(){

    connected = false;

    statusBox.classList.remove(
        "connected"
    );

    statusText.textContent =
        "قطع";

    serverName.textContent =
        "آماده اتصال";

    activeBox.classList.add(
        "off"
    );

    activeName.textContent =
        "هیچ کانفیگی فعال نیست";

    connectBtn.classList.remove(
        "connected"
    );

    connectBtn.textContent =
        "اتصال";

    configSelect.disabled =
        false;

}


/* =========================
   IMPORT CONFIG
========================= */

importBtn.addEventListener(
    "click",
    function(){

        const value =
            importInput.value.trim();


        if(!value){

            alert(
                "لطفاً یک کانفیگ VLESS وارد کنید."
            );

            return;
        }


        if(
            !value.startsWith("vless://")
        ){

            alert(
                "فقط کانفیگ VLESS قابل قبول است."
            );

            return;
        }


        /*
         * جلوگیری از کانفیگ تکراری
         */

        const duplicate =
            configs.some(function(config){

                return config.vless === value;

            });


        if(duplicate){

            alert(
                "این کانفیگ قبلاً اضافه شده است."
            );

            return;
        }


        /*
         * نام کانفیگ
         */

        let name =
            "🕷️ سرور " +
            (configs.length + 1);


        /*
         * استفاده از نام بعد از #
         */

        try{

            const hash =
                decodeURIComponent(
                    value.split("#")[1] || ""
                );

            if(hash){

                name =
                    "🕷️ " + hash;

            }

        }catch(e){}


        configs.push({

            name:name,

            vless:value

        });


        renderServers();


        configSelect.value =
            String(configs.length - 1);


        updateServer();


        importInput.value =
            "";


        alert(
            "کانفیگ با موفقیت اضافه شد."
        );

    }
);


/* =========================
   INITIALIZE
========================= */

renderServers();

updateServer();

</script>

</body>
    </html>
