<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080c">
<title>SpaedrNG VPN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(229,9,20,.14),
            transparent 38%
        ),
        #07080c;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.app{
    width:min(430px,94vw);
    min-height:650px;
    padding:30px 22px;

    border:1px solid #292d38;
    border-radius:28px;

    background:#11131a;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
}

/* LOGO */

.logo{
    text-align:center;
}

.logoIcon{
    width:72px;
    height:72px;

    border-radius:22px;

    background:#171a23;
    border:1px solid #373b47;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    margin:auto;
}

.logo h1{
    margin-top:13px;
    font-size:27px;
    letter-spacing:1px;
}

.logo p{
    margin-top:6px;
    color:#8e94a3;
    font-size:12px;
}


/* STATUS */

.statusBox{
    text-align:center;
}

.status{
    font-size:18px;
    font-weight:bold;
}

.dot{
    display:inline-block;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#e50914;

    margin-left:7px;

    box-shadow:
        0 0 14px rgba(229,9,20,.7);
}

.statusBox.connected .dot{
    background:#20d66b;

    box-shadow:
        0 0 15px rgba(32,214,107,.75);
}

.serverName{
    margin-top:10px;

    color:#8e94a3;
    font-size:13px;
}


/* SERVER COUNT */

.serverCount{
    margin-top:12px;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    padding:7px 14px;

    border-radius:12px;

    background:#171a23;
    border:1px solid #292d38;

    color:#ff3340;

    font-size:12px;
}

.serverCount small{
    color:#777e8d;
    font-size:10px;
}


/* SELECTOR */

.selector{
    width:100%;
}

.label{
    color:#8e94a3;
    font-size:12px;

    margin-bottom:8px;

    display:block;
}

.select{
    width:100%;
    height:54px;

    padding:0 15px;

    border-radius:15px;

    border:1px solid #303440;

    background:#171a23;
    color:#fff;

    font-family:inherit;
    font-size:14px;

    outline:none;
}

.select:focus{
    border-color:#e50914;
}

.select:disabled{
    opacity:.5;
}


/* CONNECT */

.connectBtn{
    width:190px;
    height:190px;

    border-radius:50%;

    border:1px solid #3a3e49;

    background:
        radial-gradient(
            circle,
            #181b24,
            #101219 70%
        );

    color:#fff;

    font-family:inherit;
    font-size:21px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 0 8px rgba(229,9,20,.035),
        0 0 55px rgba(229,9,20,.13);

    transition:.25s;
}

.connectBtn:active{
    transform:scale(.96);
}

.connectBtn.connected{
    border-color:#20d66b;

    box-shadow:
        0 0 0 8px rgba(32,214,107,.035),
        0 0 55px rgba(32,214,107,.18);
}


/* ACTIVE CONFIG */

.active{
    width:100%;

    padding:14px;

    border-radius:15px;

    background:#171a23;

    border:1px solid #292d38;

    text-align:center;
}

.activeTitle{
    color:#777e8d;

    font-size:11px;

    margin-bottom:5px;
}

.activeName{
    font-size:14px;
    font-weight:bold;
}

.active.off{
    opacity:.55;
}


/* FOOTER */

.footer{
    color:#5f6573;

    font-size:10px;

    text-align:center;
}

.footer a{
    color:#ff3340;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:430px){

    .app{
        min-height:630px;
        padding:25px 18px;
    }

    .connectBtn{
        width:175px;
        height:175px;
    }

    .logo h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- LOGO -->

    <div class="logo">

        <div class="logoIcon">
            🕷️
        </div>

        <h1>
            SpaedrNG
        </h1>

        <p>
            VLESS VPN
        </p>

    </div>


    <!-- STATUS -->

    <div
        class="statusBox"
        id="statusBox">

        <div class="status">

            <span class="dot"></span>

            <span id="statusText">
                قطع
            </span>

        </div>

        <div
            class="serverName"
            id="serverName">

            هیچ کانفیگی فعال نیست

        </div>


        <!-- SERVER COUNT -->

        <div class="serverCount">

            <span id="serverCount">
                ۲
            </span>

            <small>
                سرور
            </small>

        </div>

    </div>


    <!-- CONFIG SELECTOR -->

    <div class="selector">

        <span class="label">
            انتخاب سرور
        </span>

        <select
            id="configSelect"
            class="select">

            <option value="0">
                🕷️ سرور ۱
            </option>

            <option value="1">
                🕷️ سرور ۲
            </option>

        </select>

    </div>


    <!-- CONNECT -->

    <button
        id="connectBtn"
        class="connectBtn"
        type="button">

        اتصال

    </button>


    <!-- ACTIVE CONFIG -->

    <div
        id="activeBox"
        class="active off">

        <div class="activeTitle">
            کانفیگ فعال
        </div>

        <div
            id="activeName"
            class="activeName">

            هیچ کانفیگی فعال نیست

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <a
            href="https://t.me/spaedrNG"
            target="_blank"
            rel="noopener">

            🕷️ کانال SpaedrNG

        </a>

        <div style="margin-top:5px;">
            SpaedrNG • V2RayNG
        </div>

    </div>

</div>


<script>

/* =========================
   VLESS CONFIGS
========================= */

const configs = [

    {
        name: "🕷️ سرور ۱",

        vless:
        "vless://50414e45-4c5f-5a45-5553-2082bb32c0c0@9azpnde0ubts.nova-708ad7eaa455.workers.dev:2053?path=%2Fstream%2FPANEL_ZEUS%2F2082bb32c0c0&security=tls&encryption=none&host=9azpnde0ubts.nova-708ad7eaa455.workers.dev&type=ws&insecure=0&fp=unsafe&allowInsecure=0&sni=9azpnde0ubts.nova-708ad7eaa455.workers.dev&fm=%7B%22tcp%22%3A%20%5B%7B%22type%22%3A%20%22fragment%22%2C%22settings%22%3A%7B%22packets%22%3A%22tlshello%22%2C%22lengths%22%3A%5B%220%22%2C%22104%22%2C%221%22%5D%2C%22delays%22%3A%5B%220%22%5D%2C%22maxSplit%22%3A%220%22%7D%7D%2C%7B%22type%22%3A%22fragment%22%2C%22settings%22%3A%7B%22packets%22%3A%221-1%22%2C%22lengths%22%3A%5B%22114%22%2C%221%22%5D%2C%22delays%22%3A%5B%221%22%5D%2C%22maxSplit%22%3A%2211%22%7D%7D%5D%7D&cs=TLS_AES_256_GCM_SHA384%3ATLS_CHACHA20_POLY1305_SHA256%3ATLS_AES_128_GCM_SHA256%3ATLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384%3ATLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384%3ATLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256%3ATLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256%3ATLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256%3ATLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256%3ATLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA%3ATLS_ECDHE_RSA_WITH_AES_256_CBC_SHA%3ATLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256%3ATLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256#SpaedrNG"
    },

    {
        name: "🕷️ سرور ۲",

        vless:
        "vless://50414e45-4c5f-5a45-5553-2082bb32c0c0@9azpnde0ubts.nova-708ad7eaa455.workers.dev:2083?path=%2Fstream%2FPANEL_ZEUS%2F2082bb32c0c0&security=tls&encryption=none&host=9azpnde0ubts.nova-708ad7eaa455.workers.dev&type=ws&insecure=0&fp=unsafe&allowInsecure=0&sni=9azpnde0ubts.nova-708ad7eaa455.workers.dev&fm=%7B%22tcp%22%3A%20%5B%7B%22type%22%3A%20%22fragment%22%2C%22settings%22%3A%7B%22packets%22%3A%22tlshello%22%2C%22lengths%22%3A%5B%220%22%2C%22104%22%2C%221%22%5D%2C%22delays%22%3A%5B%220%22%5D%2C%22maxSplit%22%3A%220%22%7D%7D%2C%7B%22type%22%3A%22fragment%22%2C%22settings%22%3A%7B%22packets%22%3A%221-1%22%2C%22lengths%22%3A%5B%22114%22%2C%221%22%5D%2C%22delays%22%3A%5B%221%22%5D%2C%22maxSplit%22%3A%2211%22%7D%7D%5D%7D&cs=TLS_AES_256_GCM_SHA384%3ATLS_CHACHA20_POLY1305_SHA256%3ATLS_AES_128_GCM_SHA256%3ATLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384%3ATLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384%3ATLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256%3ATLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256%3ATLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256%3ATLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256%3ATLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA%3ATLS_ECDHE_RSA_WITH_AES_256_CBC_SHA%3ATLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256%3ATLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256#SpaedrNG"
    }

];


/* =========================
   ELEMENTS
========================= */

const connectBtn =
    document.getElementById("connectBtn");

const configSelect =
    document.getElementById("configSelect");

const statusBox =
    document.getElementById("statusBox");

const statusText =
    document.getElementById("statusText");

const serverName =
    document.getElementById("serverName");

const activeBox =
    document.getElementById("activeBox");

const activeName =
    document.getElementById("activeName");

const serverCount =
    document.getElementById("serverCount");


/* =========================
   STATE
========================= */

let connected = false;


/* =========================
   UPDATE SERVER
========================= */

function updateServer(){

    const selected =
        configs[Number(configSelect.value)];

    if(!selected) return;

    serverName.textContent =
        selected.name;

}


/* =========================
   CONFIG CHANGE
========================= */

configSelect.addEventListener(
    "change",
    function(){

        if(connected){

            alert(
                "ابتدا اتصال فعلی را قطع کنید، سپس سرور را تغییر دهید."
            );

            this.value =
                "0";

            return;
        }

        updateServer();

    }
);


/* =========================
   CONNECT / DISCONNECT
========================= */

connectBtn.addEventListener(
    "click",
    function(){

        if(connected){

            disconnect();

        }else{

            connect();

        }

    }
);


/* =========================
   CONNECT
========================= */

function connect(){

    const index =
        Number(configSelect.value);

    const selected =
        configs[index];

    if(!selected) return;


    const v2rayngURL =
        "v2rayng://install-config?url=" +
        encodeURIComponent(
            selected.vless
        );


    statusText.textContent =
        "در حال اتصال...";

    serverName.textContent =
        selected.name;


    /*
     * باز کردن V2RayNG
     */

    window.location.href =
        v2rayngURL;


    /*
     * تغییر رابط کاربری
     */

    setTimeout(function(){

        connected = true;

        statusBox.classList.add(
            "connected"
        );

        statusText.textContent =
            "متصل";

        serverName.textContent =
            selected.name + " • فعال";

        activeBox.classList.remove(
            "off"
        );

        activeName.textContent =
            selected.name;

        connectBtn.classList.add(
            "connected"
        );

        connectBtn.textContent =
            "قطع";

        configSelect.disabled =
            true;

    },1200);

}


/* =========================
   DISCONNECT
========================= */

function disconnect(){

    connected = false;

    statusBox.classList.remove(
        "connected"
    );

    statusText.textContent =
        "قطع";

    serverName.textContent =
        "هیچ کانفیگی فعال نیست";

    activeBox.classList.add(
        "off"
    );

    activeName.textContent =
        "هیچ کانفیگی فعال نیست";

    connectBtn.classList.remove(
        "connected"
    );

    connectBtn.textContent =
        "اتصال";

    configSelect.disabled =
        false;

}


/* =========================
   INITIAL STATE
========================= */

serverCount.textContent =
    configs.length;

updateServer();

</script>

</body>
    </html>
